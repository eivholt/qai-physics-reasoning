[GameInputPlatformSettings_Windows GameInputPlatformSettings]
; QaiConveyor reads the standard GameInput gamepad state directly on Windows.
; Do not also emit UE input events from GameInput (or XInputDevice): running
; both paths can duplicate button presses and can route a USB controller to a
; non-existent second local player. Keyboard and mouse still use UE mappings.
bProcessGamepad=False
bProcessController=False
bSpecialDevicesRequireExplicitDeviceConfiguration=False
bProcessRawInput=False
bProcessKeyboard=False
bProcessMouse=False
