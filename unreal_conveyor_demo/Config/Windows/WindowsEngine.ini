; Windows cooks include the SM6 hardware-ray-tracing permutations. Runtime
; selection still disables Lumen on lower tiers or unsupported adapters.
[/Script/Engine.RendererSettings]
r.SkinCache.CompileShaders=True
r.RayTracing=True
r.PathTracing=False
r.RayTracing.UseTextureLod=True
r.RayTracing.Shadows=False
; Animated workers and drivers are rasterized normally but excluded from the
; hardware RT scene. This avoids repeated skeletal BLAS rebuilds in NVIDIA's
; dynamic-geometry path while preserving hardware Lumen for warehouse meshes.
r.RayTracing.Geometry.SkeletalMeshes=0
r.RayTracing.Geometry.InstancedSkeletalMeshes=0
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=1
r.Lumen.ScreenProbeGather.ShortRangeAO.HardwareRayTracing=1
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.MaxPhysicalPages=4096
r.GBufferFormat=3
