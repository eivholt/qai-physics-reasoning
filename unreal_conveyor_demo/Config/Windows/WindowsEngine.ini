; RTX-class Windows systems use hardware Lumen for physically plausible bounce
; and hit-lit reflections. Standalone ray-traced shadows remain disabled: the
; virtual-shadow path is softer and avoids the NVIDIA dynamic-geometry crash
; seen while animated workers were included in the RT scene.
[/Script/Engine.RendererSettings]
r.SkinCache.CompileShaders=True
r.RayTracing=True
r.RayTracing.EnableOnDemand=True
r.RayTracing.Enable=True
r.PathTracing=False
r.RayTracing.UseTextureLod=True
r.RayTracing.Shadows=False
; Animated workers and drivers are rasterized normally but excluded from the
; hardware RT scene. This avoids repeated skeletal BLAS rebuilds in NVIDIA's
; dynamic-geometry path while preserving hardware Lumen for warehouse meshes.
r.RayTracing.Geometry.SkeletalMeshes=0
r.RayTracing.Geometry.InstancedSkeletalMeshes=0
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.HardwareRayTracing=True
r.Lumen.HardwareRayTracing.LightingMode=1
r.Lumen.ScreenProbeGather.ShortRangeAO.HardwareRayTracing=0
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.MaxPhysicalPages=4096
r.GBufferFormat=3

; UE 5.8.1's multi-queue GPU timestamp profiler can report sub-microsecond
; timestamp regressions on this RTX 5090/driver combination. Keep hardware
; Lumen and DXR enabled, but serialize compute work onto the graphics queue to
; avoid the unstable cross-queue path. This costs some overlap, not fidelity.
r.D3D12.AllowAsyncCompute=0
r.Lumen.AsyncCompute=0

; Compile the first hardware ray-tracing material pipeline synchronously. This
; avoids the fallback/replace burst that coincided with every observed
; GPU-profiler assertion without lowering the selected lighting path.
r.RayTracing.NonBlockingPipelineCreation=0
