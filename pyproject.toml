[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qai-cosmos-reason2"
version = "0.1.0"
description = "Experimental QAI Hub Models adapter for Cosmos-Reason2-2B"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "qai-hub-models==0.58.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["qai_hub_models.models.cosmos_reason2_2b*"]
namespaces = true

[tool.setuptools.package-data]
"qai_hub_models.models.cosmos_reason2_2b" = ["*.yaml"]
